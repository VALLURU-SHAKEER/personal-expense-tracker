
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Personal Expense Tracker</h1>
        <p>Track your expenses and manage your money.</p>
    </header>

    <main>
        <section class="summary">
            <h2>Total Expenses</h2>
            <p id="total-expenses">₹0.00</p>
        </section>

        <section class="expense-form">
            <h2>Add New Expense</h2>

            <form id="expense-form">
                <label for="expense-name">Expense Name</label>
                <input type="text" id="expense-name"
                       placeholder="e.g. Food" required>

                <label for="expense-amount">Amount (₹)</label>
                <input type="number" id="expense-amount"
                       placeholder="Enter amount" min="0.01"
                       step="0.01" required>

<label for="expense-date">Expense Date</label>
<input type="date" id="expense-date" required>

                <label for="expense-category">Category</label>
                <select id="expense-category" required>
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="expense-list">
          <label for="category-filter">Filter by Category:</label>
<select id="category-filter">
    <option value="All">All Categories</option>
    <option value="Food">Food</option>
    <option value="Travel">Travel</option>
    <option value="Shopping">Shopping</option>
    <option value="Education">Education</option>
    <option value="Other">Other</option>
</select>
            <h2>Expense History</h2>

            <ul id="expense-items">
                <li id="empty-message">No expenses added yet.</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Personal Expense Tracker | FSD Experiment 8</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
